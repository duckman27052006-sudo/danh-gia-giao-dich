services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens_dev_password
      POSTGRES_DB: fraudlens
    volumes:
      - fraudlens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fraudlens:fraudlens_dev_password@db:5432/fraudlens
      JWT_SECRET: local-compose-secret-change-before-deploy
      # Compose là môi trường local/demo: để development, vì chế độ production
      # từ chối khởi động khi COOKIE_SECURE=false hoặc DEMO_MODE=true (fail-fast).
      ENVIRONMENT: development
      DEMO_MODE: "true"
      SEED_ON_START: "true"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  fraudlens-pgdata:
